name: Build and Release

on:
  push:
    tags:
      - 'v*.*.*--desktop'

permissions:
  contents: write

jobs:
  build-desktop:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.3'
          channel: 'stable'
          cache: true

      - name: Install Inno Setup
        run: |
          choco install innosetup -y --no-progress
          echo "C:\Program Files (x86)\Inno Setup 6" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install VS 2022 Build Tools
        run: |
          choco install visualstudio2022buildtools -y --no-progress --package-parameters "--add Microsoft.VisualStudio.Workload.NativeDesktop --includeRecommended"

      - name: Debug directory structure
        run: |
          echo "=== Current directory ==="
          pwd
          echo "=== Directory contents ==="
          Get-ChildItem -Force
          echo "=== portal_host_desktop exists? ==="
          Test-Path portal_host_desktop

      - name: Get dependencies
        working-directory: portal_host_desktop
        run: flutter pub get

      - name: Generate code
        working-directory: portal_host_desktop
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build Windows release
        working-directory: portal_host_desktop
        run: |
          # Clean build directory
          if (Test-Path "build") { Remove-Item -Recurse -Force "build" }
          # Configure with CMake (will use default generator - VS 2022 after build tools install)
          cmake -B build -S windows
          # Build with Flutter using pre-configured build directory
          flutter build windows --release

      - name: Build installer
        working-directory: portal_host_desktop
        run: iscc installer.iss

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            portal_host_desktop/PortalHost-*-Setup.exe
          generate_release_notes: true

      - name: Build Android release
        working-directory: native
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: portalhost-apk
          path: native/app/build/outputs/apk/release/app-release.apk