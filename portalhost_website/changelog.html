<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Portal Host Changelog - View all releases and updates">
    <title>Changelog - Portal Host</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar" id="navbar">
        <a href="index.html" class="nav-logo">
            <img src="images/portalhost_logo2.png" alt="Portal Host" class="nav-logo-img">
            Portal Host
        </a>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="download.html">Download</a></li>
            <li><a href="changelog.html" class="active">Changelog</a></li>
        </ul>
        <button class="mobile-menu-btn" id="mobileMenuBtn">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="3" y1="12" x2="21" y2="12"></line>
                <line x1="3" y1="6" x2="21" y2="6"></line>
                <line x1="3" y1="18" x2="21" y2="18"></line>
            </svg>
        </button>
    </nav>

    <main>
        <section class="hero" style="min-height: 50vh; padding-top: 10rem;">
            <div class="hero-content">
                <h1 class="hero-title">Changelog</h1>
                <p class="hero-tagline">All notable changes to Portal Host</p>
            </div>
        </section>

        <section class="section">
            <div class="changelog-list" id="changelog-list">
                <div style="text-align: center; padding: 3rem; color: var(--text-secondary);">
                    <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="margin: 0 auto 1rem; opacity: 0.5;">
                        <circle cx="12" cy="12" r="10"></circle>
                        <path d="M12 6v6l4 2"></path>
                    </svg>
                    <p>Loading changelog...</p>
                </div>
            </div>
        </section>
    </main>

    <footer class="footer">
        <div class="footer-links">
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="download.html">Download</a>
        </div>
        <p class="footer-copyright">Portal Host &copy; 2026 — Minecraft Java Edition Server Manager</p>
    </footer>

    <script src="js/main.js"></script>
    <script>
        // Changelog page specific logic
        async function loadChangelog() {
            const container = document.getElementById('changelog-list');
            
            try {
                const response = await fetch('changelog.json');
                if (!response.ok) {
                    throw new Error(`Failed to load changelog: ${response.status}`);
                }
                const releases = await response.json();
                
                if (releases.length === 0) {
                    container.innerHTML = '<p style="text-align: center; color: var(--text-secondary);">No releases found.</p>';
                    return;
                }

                container.innerHTML = releases.map(release => {
                    const version = release.version;
                    const date = PortalHost.formatDate(release.date);
                    const prerelease = release.prerelease || false;
                    const notes = release.notes || 'No release notes provided.';
                    
                    return `
                        <div class="changelog-item">
                            <div class="changelog-header">
                                <span class="changelog-version" style="${prerelease ? 'background: linear-gradient(135deg, #f59e0b, #fbbf24);' : ''}">
                                    v${version}
                                    ${prerelease ? '<span style="margin-left: 0.5rem; font-size: 0.7rem; opacity: 0.8;">Pre-release</span>' : ''}
                                </span>
                                <span class="changelog-date">${date}</span>
                            </div>
                            <div class="changelog-body">
                                ${notes}
                            </div>
                        </div>
                    `;
                }).join('');

            } catch (error) {
                console.error('Failed to load changelog:', error);
                container.innerHTML = `
                    <div style="text-align: center; padding: 3rem; color: var(--text-secondary);">
                        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="margin: 0 auto 1rem; opacity: 0.5;">
                            <circle cx="12" cy="12" r="10"></circle>
                            <line x1="15" y1="9" x2="9" y2="15"></line>
                            <line x1="9" y1="9" x2="15" y2="15"></line>
                        </svg>
                        <p>Failed to load changelog. Please try again later.</p>
                    </div>
                `;
            }
        }

        document.addEventListener('DOMContentLoaded', loadChangelog);
    </script>
</body>
</html>
