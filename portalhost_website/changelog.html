<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Portal Host Changelog - View all releases and updates">
    <title>Changelog - Portal Host</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar" id="navbar">
        <a href="index.html" class="nav-logo">
            <img src="images/portalhost_logo2.png" alt="Portal Host" class="nav-logo-img">
            Portal Host
        </a>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="download.html">Download</a></li>
            <li><a href="changelog.html" class="active">Changelog</a></li>
        </ul>
        <button class="mobile-menu-btn" id="mobileMenuBtn">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="3" y1="12" x2="21" y2="12"></line>
                <line x1="3" y1="6" x2="21" y2="6"></line>
                <line x1="3" y1="18" x2="21" y2="18"></line>
            </svg>
        </button>
    </nav>

    <main>
        <section class="hero" style="min-height: 50vh; padding-top: 10rem;">
            <div class="hero-content">
                <h1 class="hero-title">Changelog</h1>
                <p class="hero-tagline">All notable changes to Portal Host</p>
            </div>
        </section>

        <section class="section">
            <div class="changelog-controls">
                <div class="changelog-filter">
                    <button class="changelog-filter-btn active" data-filter="all">All</button>
                    <button class="changelog-filter-btn" data-filter="desktop">Desktop</button>
                    <button class="changelog-filter-btn" data-filter="mobile">Mobile</button>
                </div>
                <span class="changelog-count" id="changelog-count">Loading...</span>
            </div>
            <div class="changelog-timeline" id="changelog-timeline">
                <div style="text-align: center; padding: 3rem; color: var(--text-secondary);">
                    <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="margin: 0 auto 1rem; opacity: 0.5;">
                        <circle cx="12" cy="12" r="10"></circle>
                        <path d="M12 6v6l4 2"></path>
                    </svg>
                    <p>Loading changelog...</p>
                </div>
            </div>
            <div class="changelog-pagination-wrapper" id="changelog-pagination"></div>
        </section>
    </main>

    <footer class="footer">
        <div class="footer-links">
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="download.html">Download</a>
        </div>
        <p class="footer-copyright">Portal Host &copy; 2026 — Minecraft Java Edition Server Manager</p>
    </footer>

    <script src="js/main.js"></script>
    <script>
        async function loadChangelog() {
            const container = document.getElementById('changelog-timeline');
            const paginationWrapper = document.getElementById('changelog-pagination');
            const countEl = document.getElementById('changelog-count');
            let currentFilter = 'all';
            let currentPage = 1;
            const itemsPerPage = 4;

            try {
                const response = await fetch('changelog.json');
                if (!response.ok) throw new Error(`Failed to load: ${response.status}`);
                const allReleases = await response.json();
                let expandedId = null;

                function getPlatformIcon(platform) {
                    if (platform === 'mobile') {
                        return `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="5" y="2" width="14" height="20" rx="2" ry="2"></rect><line x1="12" y1="18" x2="12.01" y2="18"></line></svg>`;
                    }
                    return `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect><line x1="8" y1="21" x2="16" y2="21"></line><line x1="12" y1="17" x2="12" y2="21"></line></svg>`;
                }

                function renderTimeline() {
                    const filtered = currentFilter === 'all'
                        ? allReleases
                        : allReleases.filter(r => r.platform === currentFilter);

                    const totalPages = Math.max(1, Math.ceil(filtered.length / itemsPerPage));
                    if (currentPage > totalPages) currentPage = totalPages;

                    const start = (currentPage - 1) * itemsPerPage;
                    const pageItems = filtered.slice(start, start + itemsPerPage);
                    const total = filtered.length;

                    countEl.textContent = `Showing ${Math.min(start + 1, total)}–${Math.min(start + pageItems.length, total)} of ${total} versions`;

                    if (pageItems.length === 0) {
                        container.innerHTML = `
                            <div class="changelog-empty">
                                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
                                </svg>
                                <p>No versions found for this filter.</p>
                            </div>
                        `;
                        paginationWrapper.innerHTML = '';
                        return;
                    }

                    let html = `<div class="changelog-track">`;

                    pageItems.forEach((release, index) => {
                        const isFirst = index === 0;
                        const isLast = index === pageItems.length - 1;
                        const isFeatured = start + index === 0;

                        html += `
                            <div class="changelog-item${isFeatured ? ' featured' : ''}">
                                <div class="changelog-item-node"></div>
                                <div class="changelog-item-card changelog-card${expandedId === release.version ? ' expanded' : ''}" data-id="${release.version}">
                                    <div class="changelog-card-header">
                                        <div class="changelog-card-meta">
                                            <span class="changelog-version">v${release.version}</span>
                                            <span class="changelog-date">${PortalHost.formatDate(release.date)}</span>
                                            <span class="changelog-platform-badge ${release.platform}">
                                                ${getPlatformIcon(release.platform)}
                                                ${release.platform === 'mobile' ? 'Mobile' : 'Desktop'}
                                            </span>
                                        </div>
                                        <svg class="changelog-chevron" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                                            <polyline points="6 9 12 15 18 9"></polyline>
                                        </svg>
                                    </div>
                                    <div class="changelog-card-body">
                                        <div class="changelog-card-body-content">${release.notes}</div>
                                    </div>
                                </div>
                            </div>
                        `;
                    });

                    html += `</div>`;
                    container.innerHTML = html;

                    container.querySelectorAll('.changelog-card-header').forEach(header => {
                        header.addEventListener('click', () => {
                            const card = header.closest('.changelog-card');
                            const id = card.dataset.id;
                            const wasExpanded = card.classList.contains('expanded');

                            container.querySelectorAll('.changelog-card.expanded').forEach(c => {
                                if (c !== card) c.classList.remove('expanded');
                            });

                            if (wasExpanded) {
                                card.classList.remove('expanded');
                                expandedId = null;
                            } else {
                                card.classList.add('expanded');
                                expandedId = id;
                            }
                        });
                    });

                    paginationWrapper.innerHTML = renderPagination(totalPages);

                    document.querySelectorAll('.changelog-page-btn:not(.changelog-page-prev):not(.changelog-page-next)').forEach(btn => {
                        btn.addEventListener('click', () => {
                            currentPage = parseInt(btn.dataset.page);
                            renderTimeline();
                            window.scrollTo({ top: container.offsetTop - 120, behavior: 'smooth' });
                        });
                    });

                    const prevBtn = document.querySelector('.changelog-page-prev');
                    const nextBtn = document.querySelector('.changelog-page-next');
                    if (prevBtn) {
                        prevBtn.disabled = currentPage <= 1;
                        prevBtn.addEventListener('click', () => {
                            if (currentPage > 1) {
                                currentPage--;
                                renderTimeline();
                                window.scrollTo({ top: container.offsetTop - 120, behavior: 'smooth' });
                            }
                        });
                    }
                    if (nextBtn) {
                        nextBtn.disabled = currentPage >= totalPages;
                        nextBtn.addEventListener('click', () => {
                            if (currentPage < totalPages) {
                                currentPage++;
                                renderTimeline();
                                window.scrollTo({ top: container.offsetTop - 120, behavior: 'smooth' });
                            }
                        });
                    }
                }

                function renderPagination(totalPages) {
                    if (totalPages <= 1) return '';

                    let pagesHtml = '';
                    for (let i = 1; i <= totalPages; i++) {
                        pagesHtml += `<button class="changelog-page-btn${i === currentPage ? ' active' : ''}" data-page="${i}">${i}</button>`;
                    }

                    return `
                        <div class="changelog-pagination">
                            <button class="changelog-page-btn changelog-page-prev" disabled>
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"></polyline></svg>
                            </button>
                            ${pagesHtml}
                            <button class="changelog-page-btn changelog-page-next" disabled>
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"></polyline></svg>
                            </button>
                        </div>
                    `;
                }

                document.querySelectorAll('.changelog-filter-btn').forEach(btn => {
                    btn.addEventListener('click', () => {
                        document.querySelectorAll('.changelog-filter-btn').forEach(b => b.classList.remove('active'));
                        btn.classList.add('active');
                        currentFilter = btn.dataset.filter;
                        currentPage = 1;
                        renderTimeline();
                    });
                });

                renderTimeline();

            } catch (error) {
                console.error('Failed to load changelog:', error);
                container.innerHTML = `
                    <div class="changelog-empty">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
                        </svg>
                        <p>Failed to load changelog. Please try again later.</p>
                    </div>
                `;
            }
        }

        document.addEventListener('DOMContentLoaded', loadChangelog);
    </script>
</body>
</html>
